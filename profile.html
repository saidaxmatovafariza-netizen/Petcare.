<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Profil — PetCare</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="shop.css" />
    <style>
      .profile {
        max-width: 900px;
        margin: auto;
        padding: 35px 18px;
      }
      .profile-card {
        background: #fff;
        border: 1px solid #eee;
        border-radius: 25px;
        padding: 30px;
        display: grid;
        grid-template-columns: 120px 1fr;
        gap: 25px;
      }
      .big-avatar {
        width: 110px;
        height: 110px;
        border-radius: 50%;
        background: #ff704f;
        color: #fff;
        display: grid;
        place-items: center;
        font-size: 34px;
        font-weight: 900;
      }
      .info {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px;
      }
      .info div {
        background: #fff8f6;
        border-radius: 15px;
        padding: 15px;
      }
      .info small {
        color: #7a8496;
      }
      .info b {
        display: block;
        margin-top: 5px;
      }
      @media (max-width: 650px) {
        .profile-card {
          grid-template-columns: 1fr;
        }
        .info {
          grid-template-columns: 1fr;
        }
      }
    </style>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
  </head>
  <body>
    <header class="navbar">
      <a class="logo" href="index.html"
        ><i class="fa-solid fa-paw" aria-hidden="true"></i>
        <span>PetCare</span></a
      >
      <nav>
        <a href="index.html">Bosh sahifa</a><a href="vets.html">Veterinarlar</a
        ><a href="shop.html">Do'kon</a><a href="pets.html">Hayvonlarim</a>
      </nav>
      <a class="avatar" href="profile.html">AK</a>
    </header>
    <section class="top container-fluid">
      <div class="crumb">
        <a href="index.html">Bosh sahifa</a><span>›</span><b>Profil</b>
      </div>
      <h1>Mening profilim</h1>
    </section>
    <main class="profile container">
      <div class="profile-card">
        <div class="big-avatar">AK</div>
        <div>
          <h2>Aziza Karimova</h2>
          <p class="subtitle">PetCare foydalanuvchisi</p>
          <div class="info">
            <div><small>Telefon</small><b>+998 90 000 00 00</b></div>
            <div><small>Shahar</small><b>Toshkent</b></div>
          </div>
        </div>
      </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
