<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Savat — PetCare</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="shop.css" />
    <style>
      .cart-wrap {
        max-width: 1100px;
        margin: auto;
        padding: 35px 18px;
      }
      .cart-list {
        display: grid;
        gap: 15px;
      }
      .cart-item {
        background: #fff;
        border: 1px solid #eee;
        border-radius: 20px;
        padding: 18px 22px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .cart-item h3 {
        margin-bottom: 5px;
      }
      .qty {
        display: flex;
        gap: 10px;
        align-items: center;
      }
      .qty button,
      .remove {
        border: 0;
        border-radius: 12px;
        padding: 8px 12px;
        background: #f2f4f7;
      }
      .remove {
        color: #ff674c;
      }
      .summary {
        margin-top: 25px;
        background: #fff;
        border-radius: 20px;
        padding: 22px;
        border: 1px solid #eee;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .checkout {
        border: 0;
        background: #ff674c;
        color: #fff;
        padding: 13px 25px;
        border-radius: 24px;
        font-weight: 900;
        font: inherit;
      }
      .empty-cart {
        text-align: center;
        background: #fff;
        border: 1px solid #eee;
        border-radius: 20px;
        padding: 60px;
        color: #6d778a;
      }
    </style>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
  </head>
  <body>
    <header class="navbar">
      <a class="logo" href="index.html"
        ><i class="fa-solid fa-paw" aria-hidden="true"></i>
        <span>PetCare</span></a
      >
      <nav>
        <a href="index.html">Bosh sahifa</a><a href="vets.html">Veterinarlar</a
        ><a href="shop.html">Do'kon</a><a href="pets.html">Hayvonlarim</a>
      </nav>
      <div class="nav-actions">
        <a class="nav-icon" href="cart.html"
          ><i class="fa-solid fa-cart-shopping" aria-hidden="true"></i></a
        ><a class="avatar" href="profile.html">AK</a>
      </div>
    </header>
    <section class="top container-fluid">
      <div class="crumb">
        <a href="index.html">Bosh sahifa</a><span>›</span><b>Savat</b>
      </div>
      <h1>Savat</h1>
      <p class="subtitle">Tanlagan mahsulotlaringiz shu yerda.</p>
    </section>
    <main class="cart-wrap container">
      <div id="list" class="cart-list"></div>
      <div id="empty" class="empty-cart">
        <i class="fa-solid fa-cart-shopping" aria-hidden="true"></i
        ><br /><br />Savat hozircha bo'sh.<br /><br /><a
          class="search-btn"
          href="shop.html"
          >Do'konga o'tish</a
        >
      </div>
      <div id="summary" class="summary">
        <div>
          <small>Jami</small>
          <h2 id="total">0 so'm</h2>
        </div>
        <button class="checkout" id="checkout">Buyurtma berish</button>
      </div>
    </main>
    <script>
      const list = document.getElementById("list");
      const empty = document.getElementById("empty");
      const summary = document.getElementById("summary");
      const total = document.getElementById("total");
      const checkoutBtn = document.getElementById("checkout");

      let cart = JSON.parse(localStorage.getItem("petcareCart") || "[]");

      function money(n) {
        return Number(n || 0).toLocaleString("uz-UZ") + " so'm";
      }

      function render() {
        list.innerHTML = "";
        let sum = 0;

        cart.forEach((p, i) => {
          const price = Number(p.price) || 0;
          const qty = Math.max(1, Number(p.qty) || 1);
          p.price = price;
          p.qty = qty;
          sum += price * qty;

          const item = document.createElement("div");
          item.className = "cart-item";
          item.innerHTML = `
      <div>
        <h3>${p.name}</h3>
        <p>${money(price)}</p>
      </div>
      <div class="qty">
        <button type="button" data-i="${i}" class="minus">−</button>
        <b>${qty}</b>
        <button type="button" data-i="${i}" class="plus">+</button>
        <button type="button" data-i="${i}" class="remove">Olib tashlash</button>
      </div>
    `;
          list.appendChild(item);
        });

        total.textContent = money(sum);
        empty.style.display = cart.length ? "none" : "block";
        summary.style.display = cart.length ? "flex" : "none";

        document.querySelectorAll(".minus").forEach((btn) => {
          btn.onclick = () => change(Number(btn.dataset.i), -1);
        });

        document.querySelectorAll(".plus").forEach((btn) => {
          btn.onclick = () => change(Number(btn.dataset.i), 1);
        });

        document.querySelectorAll(".remove").forEach((btn) => {
          btn.onclick = () => {
            cart.splice(Number(btn.dataset.i), 1);
            save();
          };
        });
      }

      function change(index, delta) {
        if (!cart[index]) return;
        cart[index].qty += delta;

        if (cart[index].qty <= 0) {
          cart.splice(index, 1);
        }

        save();
      }

      function save() {
        localStorage.setItem("petcareCart", JSON.stringify(cart));
        render();
      }

      checkoutBtn.addEventListener("click", () => {
        alert("Buyurtmangiz qabul qilish uchun tayyor!");
      });

      render();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
